    - id: M-4
      title: >-
        `GET /api/tow-proposals/emergency/:id` was marked as non-breaking even though
        removing the hardcoded status='pending' filter widens the response set.
      decision: FIXED
      files:
        - docs/tow/T00-LEGACY-TO-TARGET-MAPPING.md
      command: >-
        grep -n 'emergency/:id' docs/tow/T00-LEGACY-TO-TARGET-MAPPING.md;
