      fix: >-
        The mapping is now `127.0.0.1:${DB_PORT:-55432}:5432`. The bind is IPv4-loopback by
        design: `[::1]` was deliberately NOT added because the short port syntax is not
        portable across Docker/Compose versions and would require a second mapping; the
        trade-off is documented in docs/tow/T00-TEST-HARNESS.md §4 and
        `postgres_test_strategy.bind_policy`. towPostgresGuard.test.js now requires the
        loopback mapping, rejects the bare `${DB_PORT...}:5432` form and contains a negative
        control (a pre-fix copy of the compose source is rejected by the same predicate that
        approves the real file); towPostgresFoundation.e2e.test.js asserts
        `service.ports[0].host_ip === '127.0.0.1'` from the real `docker compose config`.
