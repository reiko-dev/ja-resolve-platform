    - id: M-3
      title: >-
        The shadowed-method assertion was tautological (it compared the composed
        document with itself) and could never fail, so a silently dropped base method
        would go unnoticed.
      decision: FIXED
      files:
        - socorre_ai_backend/tests/helpers/towContract.js
        - socorre_ai_backend/tests/contract/openapi.structure.test.js
        - socorre_ai_backend/scripts/tow/validate-openapi.js
