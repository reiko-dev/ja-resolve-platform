      codex_comment_id: 4045255969
      title: "Compose publishes `TOW_TEST_PG_PORT` while the client connects to `DB_PORT`"
      root_cause: >-
        `docker-compose.test.yml` published `${TOW_TEST_PG_PORT:-55432}` and the healthcheck used
        the same variable, while `pg-guard.js`/Knex/app resolved `DB_PORT`. Setting only one of
        the two produced a healthy container on a port no client could reach — a silent
        configuration divergence.
      decision: FIXED
      files:
        - socorre_ai_backend/docker-compose.test.yml
        - socorre_ai_backend/scripts/tow/test-env.js
        - socorre_ai_backend/scripts/tow/run-pg-gate.js
        - socorre_ai_backend/tests/tow/foundation/towPostgresGuard.test.js
      fix: >-
        `DB_PORT` is the single canonical variable: compose interpolates
        `${DB_PORT:-55432}:5432`, the guard resolves `DB_PORT`, and `test-env.js` forwards the
        resolved `DB_PORT`/`DB_USER`/`DB_PASSWORD`/`DB_NAME_TEST` to every compose invocation so
        interpolation can never disagree with the client. `TOW_TEST_PG_PORT` no longer exists in
        any harness file (only negative assertions mention it).
      command: >-
        grep -rn 'TOW_TEST_PG_PORT' socorre_ai_backend/scripts socorre_ai_backend/docker-compose.test.yml ;
        (cd socorre_ai_backend && npx jest tests/tow/foundation/towPostgresGuard.test.js --runInBand)
      observed_result: >-
        Zero occurrences in harness code/compose (the only matches are `not.toMatch` guards in the
        regression tests). Guard suite: 19 tests pass, including "compose defaults, healthcheck and
        guard defaults cannot drift apart", "the harness hands the resolved
        DB_PORT/DB_NAME_TEST/DB_USER to compose" and "no harness file reintroduces a second port
        variable". The live gate connects to 127.0.0.1:55432 and applies 43 migrations / 29 tables.
      regression_test: "6 new assertions in tests/tow/foundation/towPostgresGuard.test.js"
      evidence:
        - docs/evidence/t00/negative-controls/nc-c2-compose-port.txt
        - docs/evidence/t00/green-postgres-gate.txt
    - id: C3
      codex_comment_id: 4045255975
      title: "`up()` runs outside the cleanup scope, leaking the environment on startup failure"
      root_cause: >-
        `runWithEnvironment()` called `up()`/`waitForHealth()` before entering the `try`, so any
        failure during startup (image pull, port conflict, unhealthy container, timeout) skipped
        the `finally` block and left the container, network and tmpfs behind. The subsequent
        attempt then failed for a different reason (name already in use).
      decision: FIXED
      files:
        - socorre_ai_backend/scripts/tow/test-env.js
        - socorre_ai_backend/tests/tow/foundation/towHarnessLifecycle.test.js   # NEW
      fix: >-
        The guard check, `applyTestTargetDefaults()`, `startUp()`, `waitHealthy()` and the workload
        now share one `try`, with `tearDown()` in `finally`; `down()` is idempotent and never
        throws, so cleanup also runs when nothing was created. `composeAvailable()` returns false
        instead of throwing on a missing docker binary, keeping the guard CLI usable without Docker.
      command: >-
        bash scripts/tow/negative-controls.sh   # NC-C3b (pre-fix) vs NC-C3d (fixed), identical
        Docker stub that exits 1 on `up`
      observed_result: >-
        Pre-fix probe: `outcome=rejected … docker_up=true docker_down=false` — the environment
        leaks when `up()` fails. Fixed probe, same stub: `docker_up=true docker_down=true` — the
        environment is destroyed after the same failure. NC-C3a (suite red on pre-fix code) and
        NC-C3c (green on fixed code) bracket the control.
      regression_test: >-
        tests/tow/foundation/towHarnessLifecycle.test.js — 9 tests using an injected seam:
        happy path `['up','wait','down']`, `up` throws → `['up','down']`, healthcheck throws,
        workload error wins over teardown, guard fails closed, real `down()` never throws with an
        empty PATH, and CLI behaviour with a fake docker binary.
      evidence:
        - docs/evidence/t00/negative-controls/nc-c3a-lifecycle-prefix.txt
        - docs/evidence/t00/negative-controls/nc-c3b-probe-prefix.txt
        - docs/evidence/t00/negative-controls/nc-c3c-lifecycle-fixed.txt
        - docs/evidence/t00/negative-controls/nc-c3d-probe-fixed.txt
    - id: C4
      codex_comment_id: 4045255982
      title: "The Express/PostgreSQL test accepted a 404 as proof that the app booted"
      root_cause: >-
        The e2e suite asserted `expect([200, 401, 403, 404]).toContain(response.status)` on
        `GET /api/tow/module-status`. Because the Tow v1 surface is not implemented yet, the 404
        branch is the normal answer, so the test passed even when the app had no database at all:
        it never touched PostgreSQL.
      decision: FIXED
      files:
        - socorre_ai_backend/tests/tow/foundation/towPostgresFoundation.e2e.test.js
      fix: >-
        The tolerant status-set assertion was removed. The suite now proves PostgreSQL identity:
        the app's own pool (`appDb.client.config.connection`) reports the harness
        host/port/database/user, `SELECT current_database(), current_user` returns the resolved
        target, and `GET /health` returns 200 with `{success:true,status:'ok',
        checks:{http:'ok',postgres:'ok'}}` — a response only a real `SELECT 1` through the app pool
        can produce. A second new test asserts compose publishes exactly the `DB_PORT` the guard and
        the client use.
      command: >-
        TOW_POSTGRES_E2E=1 npm run test:pg   # plus the NC-C4a/NC-C4b pair with DB_SSL=true
      observed_result: >-
        With the container up: 6/6 tests pass (migrations 43, tables 29, target
        127.0.0.1:55432/socorre_ai_tow_test). Negative control NC-C4a forces a broken connection
        (DB_SSL=true) and the new assertion fails (`The server does not support SSL connections`);
        NC-C4b runs the pre-fix version of the suite under the same broken connection and it PASSES
        — the false positive is reproduced and closed.
      regression_test: "+2 tests, -1 false-positive test in towPostgresFoundation.e2e.test.js (5 → 6 enabled tests)"
      evidence:
        - docs/evidence/t00/negative-controls/nc-c4a-new-e2e-fails.txt
        - docs/evidence/t00/negative-controls/nc-c4b-old-e2e-false-positive.txt
        - docs/evidence/t00/green-postgres-gate.txt
    - id: C5
      codex_comment_id: 4045255989
      title: "`createTowRequest` accepts `customerOverrides` and silently discards it"
      root_cause: >-
        The factory read `customerOverrides` from its options but created the customer with
        `createTowCustomer({ sequenceStart })` only, so every caller that customised the customer
        (role, status, name, coordinates) got an unrelated default one — a silent fixture lie.
      decision: FIXED
      files:
        - socorre_ai_backend/tests/helpers/tow/factories.js
        - socorre_ai_backend/tests/tow/foundation/towDeterministicFoundation.test.js
      fix: >-
        `const user = customer || (await createTowCustomer({ sequenceStart, ...customerOverrides }))`
        — overrides are forwarded, and an explicitly supplied `customer` still wins (no double
        creation, no override leaking into the explicit path).
      command: "npx jest tests/tow/foundation/towDeterministicFoundation.test.js --runInBand"
      observed_result: >-
        23 tests pass, including the two new ones: "tow request factory forwards customerOverrides
        to the created customer" (asserts the persisted role/status/name) and "an explicit customer
        still wins over customerOverrides".
      regression_test: "+2 tests in towDeterministicFoundation.test.js"
      evidence:
        - docs/evidence/t00/green-tow-focused.txt
    - id: C6
      codex_comment_id: 4045255997
      title: "The root-lock evidence diff is empty because it runs after the commit"
      root_cause: >-
        `root-lock-evidence.sh` generated the GREEN state by diffing the working tree against the
        lockfile, but the lockfile had already been committed, so `git diff -- package-lock.json`
        printed nothing and the artifact could not prove that the sync changed anything.
      decision: FIXED
      files:
        - scripts/tow/root-lock-evidence.sh
        - docs/evidence/t00/root-lock-sync-red.txt
        - docs/evidence/t00/root-lock-sync-green.txt
        - docs/evidence/t00/root-lock-sync-diff.txt
      fix: >-
        The RED state is read from the committed blob (`git show <ref>:package-lock.json`) and the
        GREEN delta from `git diff <prefix> <current> -- package-lock.json`, which now FAILS when
        the delta is empty. The script also asserts the entries the sync must add (`ajv`,
        `ajv-formats`, `yaml`) and that the backend workspace devDependencies gained exactly those.
      command: "bash scripts/tow/root-lock-evidence.sh"
      observed_result: >-
        `package-lock.json | 124 +++++—` = 93 insertions / 31 deletions; added root entries
        ajv, ajv-formats, fast-deep-equal, fast-uri, json-schema-traverse, require-from-string,
        yaml; backend workspace devDependencies added ajv@^8.17.1, ajv-formats@^3.0.1,
        yaml@^2.9.1; changed: none; removed: none.
      regression_test: "non-empty-diff assertion inside scripts/tow/root-lock-evidence.sh (exit 1 on an empty delta)"
      evidence:
        - docs/evidence/t00/root-lock-sync-diff.txt
        - docs/evidence/t00/root-lock-sync-red.txt
        - docs/evidence/t00/root-lock-sync-green.txt
