    - id: M4-2
      priority: P2
      also_codex_thread: 4048163642
      title: "a teardown failure was swallowed and the gate could report GREEN while leaking resources"
      decision: FIXED
      root_cause: >-
        `down()` ran `docker compose down` with `allowFailure: true` and discarded the exit
        status, and `runWithEnvironment` only rejected on workload/startup errors. A Docker
        failure during teardown after green stages therefore left the container, network and
        tmpfs volume behind while run-pg-gate printed `[test:pg] GREEN` and exited 0 — a false
        GREEN that also hid the resource leak.
      fix: >-
        `down()` now runs the teardown with `allowFailure: true, capture: true`, re-emits the
        captured output, and throws `TeardownError` (`isTeardownFailure: true`) carrying the
        exact command and exit status on a non-zero status or a spawn error — never secrets.
        `runWithEnvironment` captures the workload/startup error first and the teardown error
        second: with no earlier error it rejects with the teardown error; with an earlier
        error it preserves that error as the rejection and attaches the teardown failure as
        `error.teardownError`. verify.js records a `teardown (docker compose down)` FAIL stage
        (and, when the only failure is a startup error with no failed stage, a `PostgreSQL
        foundation gate` FAIL), so the summary is RED; run-pg-gate.js prints the attached
        teardown error. `down()` remains idempotent when there is nothing to remove.
      files:
