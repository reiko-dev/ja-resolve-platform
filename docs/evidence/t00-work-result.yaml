postgres_test_strategy:
  engine: "PostgreSQL 14 (docker image postgres:14, already cached locally)"
  container: socorre-tow-postgres-test
  compose_file: socorre_ai_backend/docker-compose.test.yml
  isolation:
    - "tmpfs data directory, no named volume"
    - "dedicated network socorre-tow-test-net"
    - "destroyed after every run (down --volumes --remove-orphans)"
  guard: socorre_ai_backend/scripts/tow/pg-guard.js
  guard_rules:
    - "TOW_POSTGRES_E2E === '1' (explicit opt-in)"
    - "host is loopback (localhost / 127.0.0.1 / ::1)"
    - "wildcard bind hosts refused (0.0.0.0, ::, [::], *)"
    - "database name ends with _test"
    - "DATABASE_URL / PostgreSQL provider URL refused"
    - "user is not prod/root/postgres (case-insensitive substring: postgres_user, prod_admin, root2, POSTGRES all refused)"
    - "refuses with UNSAFE_TEST_DATABASE and never prints the password"
  gate_suite: socorre_ai_backend/tests/tow/foundation/towPostgresFoundation.e2e.test.js
  gate_skipped_by_default: true
  gate_tests: 6
  gate_evidence:
    command: "TOW_POSTGRES_E2E=1 npm run test:pg"
    tests: 6
    migrations_applied: 43
    migration_batch: 1
    tables_in_public: 29
    result: GREEN
    artifact: docs/evidence/t00/green-postgres-gate.txt
  custom_port_gate:   # pass 5 (Muse M3-3): live run on a non-default port; pass 6 re-recorded
    command: "DB_PORT=55999 TOW_POSTGRES_E2E=1 npm run test:pg"
    tests: 6
    published_port: 55999
    live_mapping: "docker port socorre-tow-postgres-test -> 5432/tcp -> 127.0.0.1:55999 (IPv4 loopback only)"
    target: "postgresql://tow_test@127.0.0.1:55999/socorre_ai_tow_test"
    health: "GET /health -> 200 {success:true,status:'ok',checks:{http:'ok',postgres:'ok'}}"
    result: GREEN
    torn_down: true
    artifact: docs/evidence/t00/green-postgres-gate-custom-port.txt
  bind_policy: >-
    Pass 6 (Muse M4-1 / Codex 4048163637): docker-compose.test.yml publishes
    `127.0.0.1:${DB_PORT:-55432}:5432`, so the disposable database is never exposed on a
    non-loopback interface. The bind is IPv4-loopback by design: `[::1]` is deliberately
    not added because the short port syntax is not portable across Docker/Compose versions
    and would need a second mapping. Asserted offline (towPostgresGuard.test.js requires
    the loopback mapping, rejects the bare `${DB_PORT...}:5432` mapping, and has a negative
    control) and live (towPostgresFoundation.e2e.test.js asserts
    `service.ports[0].host_ip === '127.0.0.1'` from `docker compose config`; the evidence
    files record `127.0.0.1:55432->5432/tcp` and `127.0.0.1:55999->5432/tcp`).
  teardown_contract: >-
    Pass 6 (Muse M4-2 / Codex 4048163642): `down()` is idempotent when there is nothing to
    remove (real `docker compose down` on an empty project exits 0) but a real teardown
    failure is never swallowed. With no earlier workload/startup error, `runWithEnvironment`
    rejects with the teardown error (`name: TeardownError`, `isTeardownFailure: true`), so
    run-pg-gate exits RED even after 6/6 green tests and verify.js records a
    `teardown (docker compose down)` FAIL stage; with an earlier error, that error stays the
    rejection and carries the teardown failure as `error.teardownError` (run-pg-gate.js also
    prints it). `npm run test:pg:down` exits non-zero when teardown cannot run. Messages
    carry the command and exit status, never secrets. Empirical negative control:
    docs/evidence/t00/m4-teardown-failure-negative-control.txt.
  port_coverage: >-
    Honest coverage: live containers on the default 55432 and on the non-default 55999;
    every other port is covered only by the offline config/guard/Knex/compose agreement
    assertions (towPostgresGuard.test.js + the compose-rendering test in the e2e suite).
    No per-port live container is claimed.
  commands:
    up: "npm run test:pg:up"
    wait: "npm run test:pg:wait"
    down: "npm run test:pg:down"
    guard: "npm run test:pg:guard"
    gate: "npm run test:pg"

