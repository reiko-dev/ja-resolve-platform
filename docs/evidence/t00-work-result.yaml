  install: "jest.useFakeTimers({doNotFake:[nextTick,queueMicrotask,setImmediate,clearImmediate,requestAnimationFrame,cancelAnimationFrame,requestIdleCallback,cancelIdleCallback,hrtime]})"
  limitation: "does not control PostgreSQL NOW(); T07/T10 must not rely on wall-clock comparisons in DB-side expiry (registered as C-4)"

