postgres_test_strategy:
  engine: "PostgreSQL 14 (docker image postgres:14, already cached locally)"
  container: socorre-tow-postgres-test
  compose_file: socorre_ai_backend/docker-compose.test.yml
  isolation:
    - "tmpfs data directory, no named volume"
    - "dedicated network socorre-tow-test-net"
    - "destroyed after every run (down --volumes --remove-orphans)"
  guard: socorre_ai_backend/scripts/tow/pg-guard.js
  guard_rules:
    - "TOW_POSTGRES_E2E === '1' (explicit opt-in)"
    - "host is loopback"
    - "database name ends with _test"
    - "DATABASE_URL / PostgreSQL provider URL refused"
    - "user is not prod/root/postgres"
    - "refuses with UNSAFE_TEST_DATABASE and never prints the password"
  gate_suite: socorre_ai_backend/tests/tow/foundation/towPostgresFoundation.e2e.test.js
  gate_skipped_by_default: true
  gate_tests: 5
  gate_evidence:
    command: "npm run test:pg"
    migrations_applied: 43
    migration_batch: 1
    tables_in_public: 29
    result: GREEN
  commands:
    up: "npm run test:pg:up"
    wait: "npm run test:pg:wait"
    down: "npm run test:pg:down"
    guard: "npm run test:pg:guard"
    gate: "npm run test:pg"

time_test_strategy:
