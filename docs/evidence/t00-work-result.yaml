        - docs/evidence/t00/green-contract-suite.txt
    - id: M-2
      title: >-
        The PostgreSQL fail-closed guard could be bypassed with DB_USER=postgres_user
        (substring of a privileged user) and with DB_HOST=0.0.0.0 (wildcard bind).
      decision: FIXED
      files:
        - socorre_ai_backend/scripts/tow/pg-guard.js
        - socorre_ai_backend/tests/tow/foundation/towPostgresGuard.test.js
      command: >-
