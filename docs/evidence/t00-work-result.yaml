        now share one `try`, with `tearDown()` in `finally`; `down()` is idempotent and never
        throws, so cleanup also runs when nothing was created. `composeAvailable()` returns false
        instead of throwing on a missing docker binary, keeping the guard CLI usable without Docker.
      command: >-
        bash scripts/tow/negative-controls.sh   # NC-C3b (pre-fix) vs NC-C3d (fixed), identical
