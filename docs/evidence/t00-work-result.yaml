codex_round3_resolution:
  pass: 7
  trigger: >-
    Codex round-3 adversarial review of PR #30 opened three threads after the pass-6 push:
    4048484277 (P1, fixed container/network names made concurrent harness runs destroy each
    other's resources), 4048484284 (P2, root-lock evidence mixed worktree manifests with ref
    locks) and 4048484296 (P2, a PostgreSQL startup failure could be missing from the
    verify:tow stage list). M5-1..M5-3 below mirror that numbering.
  fix_commit: 8246f989
  findings:
    - id: M5-1
      priority: P1
      codex_thread: 4048484277
      path: socorre_ai_backend/scripts/tow/test-env.js
      title: "fixed compose project names let concurrent runs destroy each other's resources"
      decision: FIXED
      root_cause: >-
        docker-compose.test.yml pinned `container_name: socorre-tow-postgres-test` and
        `networks.tow-test-net.name: socorre-tow-test-net`, and test-env.js pinned
        `COMPOSE_PROJECT = 'socorre-tow-test'`. Two runs with different DB_PORT values (or two
        checkouts on the same port) therefore resolved to the same container/network name:
        `docker compose up` reused or recreated the other run's container and `down --volumes`
        destroyed it — including its tmpfs volume — while the other gate was still running.
      fix: >-
        `resolveComposeProject(env)` is now the single source of the project name.
        `TOW_TEST_PG_PROJECT` (non-empty, trimmed) overrides it and is validated against
        `^[a-z0-9][a-z0-9_-]{0,62}$`; an invalid value throws
        `TOW_TEST_PG_PROJECT "<x>" is not a valid Compose project name (must match ...)` before
        any Docker call. The default is
        `socorre-tow-test-${resolveTestTarget(env).port}-${sha256(BACKEND_DIR).slice(0,8)}`,
        so it is unique per port AND per checkout. `compose()` passes `-p <project>`,
        `teardownCommand()`/`down()` resolve the same name from `targetEnv()` (DB_PORT
        included) and `targetEnv()` forwards it to child processes. docker-compose.test.yml
        fixes no container_name and no network name, so Compose derives
        `<project>-tow-postgres-test-1` and `<project>_tow-test-net`; the service key stays
        `tow-postgres-test` for `compose ps`.
      files:
        - socorre_ai_backend/scripts/tow/test-env.js
        - socorre_ai_backend/docker-compose.test.yml
        - socorre_ai_backend/tests/tow/foundation/towPostgresGuard.test.js
        - socorre_ai_backend/tests/tow/foundation/towPostgresFoundation.e2e.test.js
        - docs/tow/T00-TEST-HARNESS.md
      command: >-
        npx jest tests/tow/foundation/towPostgresGuard.test.js --runInBand;
        npx jest tests/tow/foundation/towPostgresFoundation.e2e.test.js --runInBand;
        TOW_POSTGRES_E2E=1 npm run test:pg; DB_PORT=55999 TOW_POSTGRES_E2E=1 npm run test:pg
      observed_result: >-
        Offline 24/24 guard tests pass, including the new `compose project isolation` describe
        (valid/invalid overrides, per-port + per-directory defaults, targetEnv forwarding) and
        the compose-file assertions that reject any `container_name:`/network `name:`. Live:
        6/6 tests pass on both ports with the derived projects
        `socorre-tow-test-55432-cb0d0933` and `socorre-tow-test-55999-cb0d0933`; the rendered
        configs carry no container_name, network `<project>_tow-test-net` and host_ip
        127.0.0.1; the compose up/down logs show
        `socorre-tow-test-55432-cb0d0933-tow-postgres-test-1` etc. No tow container, network or
        volume remains after the runs.
      evidence:
        - docs/evidence/t00/m5-1-compose-project-isolation.txt
        - docs/evidence/t00/green-postgres-gate.txt
        - docs/evidence/t00/green-postgres-gate-custom-port.txt
        - docs/evidence/t00/pass7-gates.txt
    - id: M5-2
      priority: P2
      codex_thread: 4048484284
      path: scripts/tow/root-lock-evidence.sh
      title: "root-lock evidence mixed working-tree manifests with committed ref locks"
      decision: FIXED
      root_cause: >-
        The script copied the three manifests from the WORKING TREE but the RED/GREEN locks
        from `$PREFIX_REF`/`$CURRENT_REF`. With a dirty manifest or a `TOW_LOCK_CURRENT_REF`
        different from the worktree HEAD the recorded result described neither revision, and
        the dirty-state warning covered only package-lock.json. The `cat-file` guard checked
        only package-lock.json, so a ref missing a manifest failed later with a raw git error.
      fix: >-
        `MANIFEST_PATHS` now lists all four files (root package.json, both workspace
        package.json files and package-lock.json). Both refs must contain every path — the
        script fails fast with `FATAL: <ref>:<path> not found` (exit 1) before writing
        evidence. All four staged files come from `git show <ref>:<path>`: manifests and the
        GREEN lock from `$CURRENT_REF`, the RED lock from `$PREFIX_REF`. A worktree that
        differs from `$CURRENT_REF` for any of the four paths only prints
        `WARNING: working tree differs from <ref> for: ...` and
        `WARNING: evidence uses the committed refs, not the working tree`; the recorded
        evidence is unaffected.
      files:
        - scripts/tow/root-lock-evidence.sh
        - docs/evidence/t00/root-lock-sync-red.txt
        - docs/evidence/t00/root-lock-sync-green.txt
      command: >-
        bash scripts/tow/root-lock-evidence.sh;
        (dirty throwaway worktree) bash scripts/tow/root-lock-evidence.sh;
        TOW_LOCK_CURRENT_REF=$(git hash-object -t tree /dev/null) bash scripts/tow/root-lock-evidence.sh
      observed_result: >-
        Clean run: exit 0, `root-lock refs: 0c5de7ed (pre-fix) -> HEAD (post-fix)`, RED exit 1 /
        GREEN exit 0 and a non-empty ref-to-ref delta; both artifacts re-recorded with the
        committed-manifest provenance in their headers. Dirty-worktree probe: the two warnings
        print and the committed-ref evidence is still produced (exit 0). Missing-path probe:
        `FATAL: 4b825dc...:package.json not found`, exit 1, no artifact written.
      evidence:
        - docs/evidence/t00/m5-2-root-lock-manifest-refs.txt
        - docs/evidence/t00/root-lock-sync-red.txt
        - docs/evidence/t00/root-lock-sync-green.txt
    - id: M5-3
      priority: P2
      codex_thread: 4048484296
      path: socorre_ai_backend/scripts/tow/verify.js
      title: "a PostgreSQL startup failure could be absent from the verify:tow stage list"
      decision: FIXED
      root_cause: >-
        verify.js added its synthetic `PostgreSQL foundation gate` failure entry only when
        `results.some((entry) => !entry.ok)` (the `failedBefore` predicate). When every offline
        stage passed and the PostgreSQL environment itself failed to start (dead daemon,
        unhealthy container), the summary listed the startup failure but no stage entry
        describing it — the same gap for a startup failure combined with a teardown failure.
      fix: >-
        The decision is extracted to `planPostgresFailureEntries({recordedNames, error})` in
        scripts/tow/verify-stage-recording.js. It returns a
        `PostgreSQL environment (startup)` FAIL entry whenever no PostgreSQL stage was
        recorded, plus the `teardown (docker compose down)` entry when the error carries a
        teardown failure; a recorded PostgreSQL stage is never duplicated. verify.js delegates
        to it and the `failedBefore` predicate is gone.
      files:
        - socorre_ai_backend/scripts/tow/verify.js
        - socorre_ai_backend/scripts/tow/verify-stage-recording.js   # NEW
        - socorre_ai_backend/tests/unit/towVerifyStageRecording.test.js   # NEW
      command: >-
        npx jest tests/unit/towVerifyStageRecording.test.js --runInBand;
        DOCKER_HOST=unix:///tmp/t00-dead.sock npm run verify:tow; npm run verify:tow
      observed_result: >-
        Offline: 7/7 unit tests pass, including "earlier offline failure + PG startup failure =>
        both entries", "PG stage already recorded => no duplicate", "startup + teardown => both"
        and the source assertion that verify.js delegates and has no `failedBefore`. Live with
        a dead daemon: the four offline stages PASS, then
        `FAIL PostgreSQL environment (startup)` and `FAIL teardown (docker compose down)`,
        `[verify:tow] RED (2 failing stage(s))`, exit 1. Live on the real daemon: GREEN, all
        five stages, exit 0.
      evidence:
        - docs/evidence/t00/m5-3-verify-pg-startup-failure.txt
        - docs/evidence/t00/pass7-gates.txt
