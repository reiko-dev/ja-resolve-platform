known_limitations:
  - "T00 delivers mechanism only. No Tow v1 table, endpoint, DTO, feature flag or business rule was implemented."
  - "The legacy surface still answers 404 for all 66 Tow v1 operations (documented, not fixed)."
  - "The fake clock cannot control PostgreSQL NOW(); DB-side expiry determinism is a T07/T10 design obligation (C-4)."
  - "The reais-vs-cents decision (C-10) and the pricing-ownership decision (C-1) are registered as ambiguities, not resolved."
  - "The consumer smoke validates the contract surface and generated fixtures; it does not execute client code."
  - "PostgreSQL evidence was produced on a single local PG14 container (Colima/Docker); no CI matrix was run."
  - "socorre_ai_backend/.env.test.example is tracked intentionally: pass 2 added the exact-path negation `!socorre_ai_backend/.env.test.example` to .gitignore so it no longer depends on `git add -f`. It contains placeholders only; real `.env*` files remain ignored (docs/evidence/t00/gitignore-env-test-example.txt)."
  - "legacy-surface-probe.js boots the real app with no database connection; unmatched routes 404 before any query, so no DB is required."
