      codex_comment_id: 4045255975
      title: "`up()` runs outside the cleanup scope, leaking the environment on startup failure"
      root_cause: >-
        `runWithEnvironment()` called `up()`/`waitForHealth()` before entering the `try`, so any
        failure during startup (image pull, port conflict, unhealthy container, timeout) skipped
        the `finally` block and left the container, network and tmpfs behind. The subsequent
        attempt then failed for a different reason (name already in use).
      decision: FIXED
      files:
