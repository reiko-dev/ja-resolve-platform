root_workspace_lock:
  problem: >-
    the repository root is an npm workspace (workspaces: [socorre_ai_backend,
    socorre_ai_admin]); adding ajv/ajv-formats/yaml to
    socorre_ai_backend/package.json without resyncing the ROOT package-lock.json
    breaks `npm ci` at the repository root.
  precedent: "15771e1e fix(release): sync workspace root lock with backend sharp dependency"
  reproduction:
    command: "npm ci --dry-run   (isolated temp copy of root package.json + root lock@0c5de7ed + both workspace package.json)"
    result: "EUSAGE, exit 1"
    missing_from_lock_file:
      - ajv@8.20.0
      - ajv-formats@3.0.1
      - yaml@2.9.1
      - fast-deep-equal@3.1.3
      - fast-uri@3.1.8
      - json-schema-traverse@1.0.0
      - require-from-string@2.0.2
    evidence: docs/evidence/t00/root-lock-sync-red.txt
  fix:
    command: "npm install --package-lock-only   (at the repository root)"
    exit_code: 0
    node_modules_touched: false
    workspace_package_jsons_changed: false
    verification: >-
      sha256 of package.json, socorre_ai_backend/package.json and
      socorre_ai_admin/package.json identical before/after; node_modules entry
      count (356) and mtime unchanged.
  validation:
    command: "npm ci --dry-run   (same isolated copy, post-fix lock)"
    result: "exit 0, added 1955 packages in <1s"
    evidence: docs/evidence/t00/root-lock-sync-green.txt
  diff:
    stat: "package-lock.json | 124 +++++--- (93 insertions, 31 deletions)"
    added_root_entries: [ajv, ajv-formats, fast-deep-equal, fast-uri, json-schema-traverse, require-from-string, yaml]
    removed_entries: "nested duplicates hoisted to the root (socorre_ai_admin/node_modules/{fast-deep-equal,fast-uri,require-from-string}, socorre_ai_backend/node_modules/fast-deep-equal)"
    unrelated_version_changes: 0
    evidence: docs/evidence/t00/root-lock-sync-diff.txt
  reproducible_script: scripts/tow/root-lock-evidence.sh
  obligation_documented_in: docs/tow/T00-TEST-HARNESS.md §1.1

