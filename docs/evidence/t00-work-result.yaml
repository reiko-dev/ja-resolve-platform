      codex_comment_id: 4045255953
      title: "`.env.test` is documented but never loaded by any entrypoint"
      root_cause: >-
        `.env.test.example` advertised DB_*/TOW_POSTGRES_E2E, but nothing read the file:
        `pg-guard.js` and `test-env.js` used `process.env` only, and the one `dotenv` call on
        the path (through `src/config/postgresConnection.js`) loaded `.env` — a development
        file that the harness must never read. A fresh clone therefore ran with defaults while
        believing the file applied.
      decision: FIXED
      files:
        - socorre_ai_backend/scripts/tow/test-env-file.js        # NEW: the single loader
        - socorre_ai_backend/scripts/tow/pg-guard.js
        - socorre_ai_backend/scripts/tow/test-env.js
        - socorre_ai_backend/scripts/tow/run-pg-gate.js
        - socorre_ai_backend/scripts/tow/verify.js
        - socorre_ai_backend/tests/helpers/tow/postgres.js
        - socorre_ai_backend/.env.test.example
        - socorre_ai_backend/tests/tow/foundation/towHarnessEnvFile.test.js   # NEW
      fix: >-
        `loadTestEnvFile()` reads ONLY `<backend>/.env.test` (optional; `TOW_TEST_ENV_FILE`
        overrides the path for tests), parses it with `dotenv.parse`, applies only variables
        that are absent-or-empty in the process environment (never `override: true`) and
        reports `{path, exists, applied[], keptFromEnvironment[], note}`. It is invoked at
        module load by `pg-guard.js`, `test-env.js` and the Knex helper, so guard, compose,
        migrations, the Express singleton and Jest children all see the same values. Shell/CI
        values always win and an explicit `TOW_POSTGRES_E2E=0` still vetoes the file.
      command: >-
        cp socorre_ai_backend/.env.test.example socorre_ai_backend/.env.test &&
        (cd socorre_ai_backend && npm run test:pg:guard && npm run verify:tow) ;
        rm -f socorre_ai_backend/.env.test
      observed_result: >-
        With the file present: `[test-env] env file: .../.env.test loaded (14 value(s) applied,
        0 kept from the environment)` → `SAFE` → target
        `postgresql://tow_test@127.0.0.1:55432/socorre_ai_tow_test`; `verify:tow` GREEN with the
        PostgreSQL e2e suite actually executing (2 skipped / 13 passed of 15 suites, 9 skipped /
        263 passed of 272 tests). Without the file the offline gates stay green on the defaults
        (`.env.test` is optional and git-ignored: `.gitignore:57 **/.env.*`).
      regression_test: >-
        tests/tow/foundation/towHarnessEnvFile.test.js — 11 tests: loader contract (optional
        file, shell precedence, empty-value handling, `.env` never read, TOW_TEST_ENV_FILE seam)
        plus child-process tests proving the real entrypoints (pg-guard CLI, Knex helper) observe
        the file with a hermetic environment.
      evidence:
        - docs/evidence/t00/env-test-present-guard.txt
        - docs/evidence/t00/env-test-present-verify-tow.txt
        - docs/evidence/t00/env-test-present-tow-focused.txt
        - docs/evidence/t00/env-test-present-gitignore.txt
