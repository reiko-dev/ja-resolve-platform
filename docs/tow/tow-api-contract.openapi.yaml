  /tow/vehicles/{vehicleId}/deactivate:
    post:
      tags: [Tow Vehicles]
      operationId: deactivateTowVehicle
      security: [{ bearerAuth: [] }]
      description: >-
        Deactivates the authenticated Tow partner's own vehicle (runtime
        extension declared in draft.10; the counterpart of activate). The
        vehicle remains owned and can be reactivated; occupancy is a separate
        authority.
      parameters:
        - $ref: './tow-api-contract.base.openapi.yaml#/components/parameters/VehicleId'
      responses:
        '200':
          description: TowVehicle deactivated
          content:
            application/json:
              schema: { $ref: './tow-api-contract.base.openapi.yaml#/components/schemas/TowVehicleResponse' }
        '401': { $ref: './tow-api-contract.base.openapi.yaml#/components/responses/Unauthorized' }
        '403': { $ref: './tow-api-contract.base.openapi.yaml#/components/responses/Forbidden' }
        '404': { $ref: './tow-api-contract.base.openapi.yaml#/components/responses/NotFound' }
  /tow/vehicles/{vehicleId}/documents/{documentId}/download:
