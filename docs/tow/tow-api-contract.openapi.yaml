  /admin/tow/audit-events:
    $ref: './tow-api-contract.base.openapi.yaml#/paths/~1admin~1tow~1audit-events'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    TowProposal:
      type: object
      required: [id, request_id, partner_id, tow_vehicle, route_quote, price, status, expires_at, created_at]
      properties:
        id: { type: string }
        request_id: { type: string }
        partner_id: { type: string }
        partner:
          type: object
          properties:
            display_name: { type: string }
            rating: { type: number, minimum: 0, maximum: 5 }
            review_count: { type: integer, minimum: 0 }
        tow_vehicle: { $ref: './tow-api-contract.base.openapi.yaml#/components/schemas/TowVehicleSummary' }
        route_quote: { $ref: './tow-api-contract.base.openapi.yaml#/components/schemas/RouteQuote' }
        price: { $ref: './tow-api-contract.base.openapi.yaml#/components/schemas/Money' }
        status: { $ref: '#/components/schemas/TowProposalStatus' }
        expires_at: { type: string, format: date-time }
        counteroffer:
          oneOf:
            - $ref: './tow-api-contract.base.openapi.yaml#/components/schemas/Counteroffer'
            - type: 'null'
        created_at: { type: string, format: date-time }

    TowProposalStatus:
      type: string
      enum: [ACTIVE, COUNTERED, ACCEPTED, REJECTED, WITHDRAWN, EXPIRED, CLOSED]

    EnvelopeTowProposal:
      type: object
      required: [success, data]
      properties: { success: { const: true }, data: { $ref: '#/components/schemas/TowProposal' } }
    TowProposalResponse: { $ref: '#/components/schemas/EnvelopeTowProposal' }

    ErrorResponse:
      type: object
      required: [success, message, error]
      properties:
        success: { const: false }
        message: { type: string }
        error:
          type: object
          required: [code]
          properties:
            code:
              type: string
              enum: [service_module_disabled, outstanding_financial_debt, partner_platform_fee_debt_limit, partner_not_operational, invalid_tow_state, invalid_tow_transition, not_request_owner, not_assigned_partner, stale_tracking_update, vehicle_not_compatible, vehicle_not_operational, tow_document_required, tow_document_not_approved, proposal_already_active, proposal_expired, proposal_not_actionable, counteroffer_already_used, counteroffer_expired, request_already_assigned, payment_not_ready, payment_failed, payment_method_not_changeable, customer_no_show_not_allowed_yet, idempotency_conflict, conflict, validation_error, unauthorized, forbidden, not_found, external_dependency_unavailable]
            details:
              type: object
              additionalProperties: true

    TowSettingsPatch:
      type: object
      additionalProperties: false
      minProperties: 1
      description: >-
        True partial update. Every property is optional. Backend merges the subset
        with persisted settings and validates invariants on the complete result.
      properties:
        tow_initial_radius_km: { type: number, exclusiveMinimum: 0 }
        tow_radius_increment_km: { type: number, exclusiveMinimum: 0 }
        tow_max_radius_km: { type: number, exclusiveMinimum: 0, maximum: 100 }
        tow_radius_expansion_interval_minutes: { type: integer, minimum: 1 }
        tow_request_search_timeout_minutes: { type: integer, minimum: 1 }
        tow_proposal_expiry_minutes: { type: integer, minimum: 1 }
        tow_counteroffer_expiry_minutes: { type: integer, minimum: 1 }
        tow_completion_confirmation_timeout_minutes: { type: integer, minimum: 1 }
        tow_customer_no_show_timeout_minutes: { type: integer, minimum: 1 }
        tow_platform_fixed_fee_cents: { type: integer, minimum: 0 }
        tow_cancellation_fee_cents: { type: integer, minimum: 0 }
        tow_cancellation_partner_percentage: { type: number, minimum: 0, maximum: 100 }
        tow_cancellation_platform_percentage: { type: number, minimum: 0, maximum: 100 }
        tow_max_platform_fee_debt_cents: { type: integer, minimum: 0 }

    TowRouteSnapshot:
      type: object
      required: [request_id, pickup, destination, route_quote]
      properties:
        request_id: { type: string }
        pickup: { $ref: './tow-api-contract.base.openapi.yaml#/components/schemas/GeoPoint' }
        destination: { $ref: './tow-api-contract.base.openapi.yaml#/components/schemas/GeoPoint' }
        route_quote: { $ref: './tow-api-contract.base.openapi.yaml#/components/schemas/RouteQuote' }
        encoded_polyline:
          type: [string, 'null']
          description: Google-compatible encoded route geometry when available.
        generated_at: { type: string, format: date-time }
    TowRouteResponse:
      type: object
      required: [success, data]
      properties:
        success: { const: true }
        data: { $ref: '#/components/schemas/TowRouteSnapshot' }

    PartnerTowStatus:
      type: object
      required: [module_enabled, online, available, operational, blocking_reasons]
      properties:
        module_enabled: { type: boolean }
        online: { type: boolean }
        available: { type: boolean }
        operational: { type: boolean }
        active_tow_vehicle:
          oneOf:
            - $ref: './tow-api-contract.base.openapi.yaml#/components/schemas/TowVehicleSummary'
            - type: 'null'
        current_location:
          oneOf:
            - $ref: './tow-api-contract.base.openapi.yaml#/components/schemas/TrackingPoint'
            - type: 'null'
        blocking_reasons:
          type: array
          uniqueItems: true
          items:
            type: string
            enum:
              - MODULE_DISABLED
              - PARTNER_NOT_APPROVED
              - PARTNER_OFFLINE
              - PARTNER_UNAVAILABLE
              - NO_ACTIVE_TOW_VEHICLE
              - TOW_VEHICLE_DOCUMENT_NOT_APPROVED
              - TOW_VEHICLE_DOCUMENT_EXPIRED
              - PLATFORM_FEE_DEBT_LIMIT
              - ACTIVE_SERVICE
    PartnerTowStatusResponse:
      type: object
      required: [success, data]
      properties:
        success: { const: true }
        data: { $ref: '#/components/schemas/PartnerTowStatus' }
    PatchPartnerTowStatusInput:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        online: { type: boolean }
        available: { type: boolean }
    PartnerLocationInput:
      type: object
      additionalProperties: false
      required: [latitude, longitude, recorded_at]
      properties:
        latitude: { type: number, minimum: -90, maximum: 90 }
        longitude: { type: number, minimum: -180, maximum: 180 }
        recorded_at: { type: string, format: date-time }

    PartnerFinancialSummary:
      type: object
      required: [currency, wallet_available_cents, platform_fee_debt_cents, platform_fee_debt_limit_cents, blocked_by_debt]
      properties:
        currency: { const: BRL }
        wallet_available_cents: { type: integer, minimum: 0 }
        pending_settlement_cents: { type: integer, minimum: 0 }
        platform_fee_debt_cents: { type: integer, minimum: 0 }
        platform_fee_debt_limit_cents: { type: integer, minimum: 0 }
        blocked_by_debt: { type: boolean }
    PartnerFinancialSummaryResponse:
      type: object
      required: [success, data]
      properties:
        success: { const: true }
        data: { $ref: '#/components/schemas/PartnerFinancialSummary' }

    OpportunityCompatibility:
      type: object
      required: [compatible, vehicle_class_supported, weight_within_capacity]
      properties:
        compatible: { const: true }
        vehicle_class_supported: { const: true }
        weight_within_capacity: { const: true }
    TowOpportunity:
      type: object
      required: [request, active_tow_vehicle, route_quote, proposed_price, compatibility]
      properties:
        request: { $ref: './tow-api-contract.base.openapi.yaml#/components/schemas/TowRequest' }
        active_tow_vehicle: { $ref: './tow-api-contract.base.openapi.yaml#/components/schemas/TowVehicleSummary' }
        route_quote: { $ref: './tow-api-contract.base.openapi.yaml#/components/schemas/RouteQuote' }
        proposed_price: { $ref: './tow-api-contract.base.openapi.yaml#/components/schemas/Money' }
        compatibility: { $ref: '#/components/schemas/OpportunityCompatibility' }
        opportunity_expires_at:
          type: [string, 'null']
          format: date-time
          description: >-
            When the opportunity stops being offered, or `null` while nothing
            expires it. MVP-03 opportunities do not expire by scheduler: this
            delivery has no search timeout and no opportunity/proposal expiry
            owner (proposal lifecycle is a later delivery), so the backend emits
            `null`. The field is therefore OPTIONAL: consumers must treat `null`
            and an absent value identically. It becomes a non-null instant only
            in the delivery that owns expiry semantics; it is never derived from
            the proposal-expiry setting.
    TowOpportunityListResponse:
      type: object
      required: [success, data]
      properties:
        success: { const: true }
        data:
          type: object
          required: [items, meta]
          properties:
            items:
              type: array
              items: { $ref: '#/components/schemas/TowOpportunity' }
            meta: { $ref: './tow-api-contract.base.openapi.yaml#/components/schemas/PaginationMeta' }

    PartnerSummary:
      type: object
      required: [id, display_name]
      properties:
        id: { type: string }
        display_name: { type: string }
    AdminVehicleDocumentDetail:
      type: object
      required: [document, tow_vehicle, partner]
      properties:
        document: { $ref: './tow-api-contract.base.openapi.yaml#/components/schemas/TowVehicleDocument' }
        tow_vehicle: { $ref: './tow-api-contract.base.openapi.yaml#/components/schemas/TowVehicle' }
        partner: { $ref: '#/components/schemas/PartnerSummary' }
    AdminVehicleDocumentDetailResponse:
      type: object
      required: [success, data]
      properties:
        success: { const: true }
        data: { $ref: '#/components/schemas/AdminVehicleDocumentDetail' }

    FinancialConsequenceSummary:
      type: object
      properties:
        cancellation_fee_cents: { type: integer, minimum: 0 }
        refund_status: { type: [string, 'null'] }
        customer_debt_cents: { type: integer, minimum: 0 }
        partner_entitlement_cents: { type: integer, minimum: 0 }
        platform_fee_cents: { type: integer, minimum: 0 }
        payout_status: { type: [string, 'null'] }
        currency: { const: BRL }
    AdminTowRequestDetail:
      type: object
      required: [request, proposals, route, tracking, payment, financial, audit_events]
      properties:
        request: { $ref: './tow-api-contract.base.openapi.yaml#/components/schemas/TowRequest' }
        proposals:
          type: array
          items: { $ref: './tow-api-contract.base.openapi.yaml#/components/schemas/TowProposal' }
        route: { $ref: '#/components/schemas/TowRouteSnapshot' }
        tracking:
          type: array
          items: { $ref: './tow-api-contract.base.openapi.yaml#/components/schemas/TrackingPoint' }
        payment: { $ref: './tow-api-contract.base.openapi.yaml#/components/schemas/PaymentSummary' }
        financial: { $ref: '#/components/schemas/FinancialConsequenceSummary' }
        audit_events:
          type: array
          items: { $ref: './tow-api-contract.base.openapi.yaml#/components/schemas/AuditEvent' }
    AdminTowRequestDetailResponse:
      type: object
      required: [success, data]
      properties:
        success: { const: true }
        data: { $ref: '#/components/schemas/AdminTowRequestDetail' }

    AdminDisputeDetail:
      type: object
      required: [dispute, request, proposals, route, tracking, payment, customer_debts, audit_events]
      properties:
        dispute: { $ref: './tow-api-contract.base.openapi.yaml#/components/schemas/Dispute' }
        request: { $ref: './tow-api-contract.base.openapi.yaml#/components/schemas/TowRequest' }
        proposals:
          type: array
          items: { $ref: './tow-api-contract.base.openapi.yaml#/components/schemas/TowProposal' }
        route: { $ref: '#/components/schemas/TowRouteSnapshot' }
        tracking:
          type: array
          items: { $ref: './tow-api-contract.base.openapi.yaml#/components/schemas/TrackingPoint' }
        payment: { $ref: './tow-api-contract.base.openapi.yaml#/components/schemas/PaymentSummary' }
        customer_debts:
          type: array
          items: { $ref: './tow-api-contract.base.openapi.yaml#/components/schemas/CustomerDebt' }
        financial: { $ref: '#/components/schemas/FinancialConsequenceSummary' }
        audit_events:
          type: array
          items: { $ref: './tow-api-contract.base.openapi.yaml#/components/schemas/AuditEvent' }
    AdminDisputeDetailResponse:
      type: object
      required: [success, data]
      properties:
        success: { const: true }
        data: { $ref: '#/components/schemas/AdminDisputeDetail' }

    PayoutPartnerItem:
      type: object
      required: [partner_id, eligible_amount_cents, platform_fee_debt_offset_cents, payout_amount_cents, currency, status]
      properties:
        partner_id: { type: string }
        eligible_amount_cents: { type: integer, minimum: 0 }
        platform_fee_debt_offset_cents: { type: integer, minimum: 0 }
        payout_amount_cents: { type: integer, minimum: 0 }
        currency: { const: BRL }
        status:
          type: string
          enum: [ELIGIBLE, PROCESSING, PAID, FAILED, HELD]
        failure_reason: { type: [string, 'null'] }
    PayoutPreviewDetail:
      type: object
      required: [partner_count, total_amount_cents, currency, items]
      properties:
        partner_count: { type: integer, minimum: 0 }
        total_amount_cents: { type: integer, minimum: 0 }
        currency: { const: BRL }
        items:
          type: array
          items: { $ref: '#/components/schemas/PayoutPartnerItem' }
    PayoutPreviewDetailResponse:
      type: object
      required: [success, data]
      properties:
        success: { const: true }
        data: { $ref: '#/components/schemas/PayoutPreviewDetail' }
    PayoutBatchDetail:
      type: object
      required: [id, status, partner_count, total_amount_cents, currency, items, created_at]
      properties:
        id: { type: string }
        status:
          type: string
          enum: [CREATED, PROCESSING, PROCESSED, PARTIAL_FAILURE, FAILED]
        partner_count: { type: integer, minimum: 0 }
        total_amount_cents: { type: integer, minimum: 0 }
        currency: { const: BRL }
        items:
          type: array
          items: { $ref: '#/components/schemas/PayoutPartnerItem' }
        created_at: { type: string, format: date-time }
        processed_at: { type: [string, 'null'], format: date-time }
    PayoutBatchDetailResponse:
      type: object
      required: [success, data]
      properties:
        success: { const: true }
        data: { $ref: '#/components/schemas/PayoutBatchDetail' }
