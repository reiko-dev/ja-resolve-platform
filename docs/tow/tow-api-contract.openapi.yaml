        '401': { $ref: './tow-api-contract.base.openapi.yaml#/components/responses/Unauthorized' }
        '403': { $ref: './tow-api-contract.base.openapi.yaml#/components/responses/Forbidden' }

  /tow/vehicles:
    $ref: './tow-api-contract.base.openapi.yaml#/paths/~1tow~1vehicles'
