openapi: 3.1.0
info:
  title: JaResolve Tow Consumer API
  version: 1.0.0-draft.11
  description: >-
    Normative consumer contract for Mobile Cliente, Mobile Parceiro and Dashboard.
    This entrypoint composes the reviewed draft.2 base contract with the frozen
    discovery/rehydration endpoints, true-partial Tow settings PATCH, partner
    operational availability/location, route geometry and richer Dashboard detail
    contracts required to implement the complete consumer flows without inventing
    undocumented endpoints or DTOs. Backend T00-T18 must converge to this contract
    or explicitly revise it with contract tests and matching documentation updates.
    Revision draft.5 (MVP-03 external contract correction EXT-MVP03-1): the partner
    opportunity item now carries the truthful `active_tow_vehicle` and
    `compatibility` members required by this document, and
    `opportunity_expires_at` is nullable/optional because MVP-03 owns no expiry
    semantics (no scheduler, no search timeout, no proposal lifecycle). No other
    consumer contract changed in this revision.
    Revision draft.6 (MVP-04 additive error vocabulary): `ErrorResponse.error.code`
    gains `proposal_already_active`, the code returned when a partner already holds
    a live proposal for the same request (409). The addition is purely additive —
    every previously declared code keeps its meaning and no response shape, path,
    parameter or enum member is removed or narrowed — and it mirrors the existing
    `request_already_assigned` / `counteroffer_already_used` family rather than
    overloading the generic `conflict`. No other consumer contract changed in this
    revision; the MVP-04 operations themselves were already declared in the base
    contract.
    Revision draft.7 (MVP-04 external correction pass EXT-MVP04-1/2/3): three
    clarifications make the declared MVP-04 surface match the running backend.
    (1) `GET /tow/partner/jobs` (`listPartnerTowJobs`) is now documented as what it
    is: the authenticated partner's own job list, whose identity comes exclusively
    from the bearer token and whose items are read from the SAME `tow_assignments`
    authority the customer recovery path reads, so `from`/`to` are INCLUSIVE bounds
    on `assignment.assigned_at` (the assignment instant), not on the request
    creation instant, and the query subset is exactly `state`, `from`, `to`, `page`,
    `limit`. (2) `POST /tow/proposals/{proposalId}/accept` and
    `POST /tow/proposals/{proposalId}/withdraw` now declare `422` because the
    `Idempotency-Key` header they already required is ENFORCED at runtime (8–128
    characters, validated before any mutation); accept replays remain keyed by
    `proposal_id` + the database uniqueness constraints, and a withdraw retry by
    the owning partner returns the same withdrawn proposal. (3) the MVP-04
    operations now declare the full truthful status surface the backend produces —
    `401` (no/invalid token), `403` (wrong role or foreign owner), `404` (unknown
    request/proposal), `409` (domain conflict) and `422` (invalid query or
    `Idempotency-Key`) — instead of only the happy path. Every change is additive:
    no path, parameter, response shape or enum member is removed or narrowed, and
    the base contract is untouched.
    Revision draft.8 (MVP-05 service execution, live tracking and basic
    cancellation): the eight operations the base contract already declared for
    this flow — `startTowEnRoute`, `markTowArrived`, `startTowInTransit`,
    `finishTowService`, `cancelTowRequestByCustomer`, `cancelTowRequestByPartner`,
    `getTowTracking`, `postTowTrackingPoint` — are now re-declared here with the
    truthful status surface the backend produces (`401` no/invalid token, `403`
    wrong role or foreign owner/partner, `404` unknown or non-canonical request id,
    `409` illegal transition / terminal state / stale tracking point, `422` invalid
    `Idempotency-Key`, invalid `LocationInput`, invalid tracking point or invalid
    cancellation reason), and `ErrorResponse.error.code` gains `stale_tracking_update`,
    returned when a partner posts a tracking point OLDER than the one already
    stored (an equal instant is accepted and replaces the point). This revision
    also closes one INHERITED gap in the same enum: `partner_not_operational` has
    been returned by `POST /tow/requests/{requestId}/proposals` (403, a partner
    that is not an eligible Tow partner) since MVP-04 but was never declared here
    nor in §12 of TOW-API-CONTRACT.md; it is added to both, with the existing
    MVP-04 runtime assertions as proof, and no code is removed or renamed. Two
    further clarifications are consumer-visible and are recorded here
    because they are behavioural, not additive: (1) `allowed_actions` is
    VIEWER-AWARE — the assigned partner is offered the forward milestone
    (`start_en_route`, `mark_arrived`, `start_in_transit`, `finish_service`) plus
    `cancel` while the request is `ASSIGNED`, `EN_ROUTE` or `ARRIVED`, whereas the
    customer is offered only `cancel` in those states; no other viewer/state pair
    changed, and the member itself, its type and its enum are unchanged. (2)
    `POST /tow/requests/{requestId}/cancel` accepts an optional body
    (`reason`, max 1000) exactly as the base declares, while
    `POST /tow/requests/{requestId}/cancel-partner` requires
    `RequiredReasonInput` (1–2000); both persist the terminal attribution
    (`terminal_reason` `CUSTOMER_CANCELLED`/`PARTNER_CANCELLED`) and release the
    assignment with `release_reason` `CANCELLED`. No path, parameter, response
    shape or enum member is removed or narrowed, and the base contract stays
    byte-identical.
    Revision draft.9 (MVP-06 CASH payment and lean end-to-end readiness): the
    three payment operations the base contract already declared —
    `selectTowPaymentMethod`, `getTowPaymentSummary`, `markTowCashReceived` — are
    now IMPLEMENTED and this revision records the exact implemented subset plus
    the two consumer-visible behaviours the runtime adds. (1) MVP-06 implements
    ONLY the `cash` member of `PaymentMethod`: `card` and `pix` remain valid in
    the frozen schema (they describe Phase 2 / #33) but answer `422
    validation_error` at runtime with reason `method_not_supported_in_mvp`, and
    `payment_source_token` is rejected for cash because the MVP calls no payment
    gateway. (2) `PaymentSummary.can_start_service` becomes `true` once cash is
    selected (`CASH_SELECTED`) or received (`CASH_RECEIVED`); it was always
    `false` before this delivery. The implemented `PaymentStatus` transitions are
    exactly `NOT_SELECTED -> CASH_SELECTED -> CASH_RECEIVED` when the customer
    selects cash, and `NOT_SELECTED -> CASH_RECEIVED` when the assigned partner
    confirms a bodyless cash receipt on an already `COMPLETED` Tow that never had
    a selection (the payment row is created lazily on the first financial write,
    which may be the confirmation itself); every CARD/PIX, debt, payout, refund
    and dispute state remains declared for the long-term target and is NOT
    reachable in this MVP. `POST
    /tow/requests/{requestId}/cash-received` keeps its bodyless request exactly
    as declared — the amount is always the accepted assignment's frozen final
    price, never a client input. `TowRequest.allowed_actions` deliberately does
    NOT yet advertise `select_payment_method` or `mark_cash_received`
    (documented omission, not a false claim): the authoritative signal is
    `TowRequest.payment.status` and `GET /tow/requests/{requestId}/payment`. No
    path, parameter, response shape or enum member is removed or narrowed, and
    the base contract stays byte-identical.
    Revision draft.10 (T5 contract/runtime synchronization — docs-only, no
    runtime change): three routes the accepted MVP runtime has always served
    are now declared, and the accepted runtime deltas are recorded instead of
    silently assumed. (1) The runtime-only operations are added additively:
    `POST /tow/vehicles/{vehicleId}/deactivate` (`deactivateTowVehicle`, the
    owning Tow partner's own vehicle; the counterpart of the already-declared
    activate), `GET /tow/vehicles/{vehicleId}/documents/{documentId}/download`
    (`downloadTowVehicleDocument`) and
    `GET /admin/tow/vehicle-documents/{documentId}/download`
    (`adminDownloadTowVehicleDocument`); the two downloads return the stored
    bytes as `application/octet-stream` with `Content-Disposition: attachment`
    to the owning partner / an admin only (401/403/404, never a public URL),
    proven by `tests/tow/mvp01/towDocumentDownload.test.js`. (2) The accepted
    MVP runtime does NOT validate the `Idempotency-Key` header on six routed
    operations whose long-term base declaration requires it —
    `activateTowVehicle`, `deleteTowVehicleDocument`, `adminToggleTowModule`,
    `adminPatchTowSettings`, `adminApproveTowVehicleDocument` and
    `adminRejectTowVehicleDocument`: the header is accepted and ignored (no
    `422`, no dedupe semantics), and the long-term declaration is deliberately
    NOT narrowed here. (3) `GET /tow/requests/{requestId}/route`
    (`getTowRequestRoute`) was recorded
    as declared-but-unrouted (Phase 2 / #33) rather than removed, so the contract
    was not narrowed. It is now IMPLEMENTED — see the draft.11 revision note. No
    existing path, parameter, response shape or enum member is removed or
    narrowed, and the base contract stays byte-identical.
    Revision draft.11 (B5 route visualization — the declared operation is now
    implemented, additive): `GET /tow/requests/{requestId}/route`
    (`getTowRequestRoute`) is no longer declared-but-unrouted. The owning
    customer or the assigned Tow partner now reads the request's own
    pickup -> destination route snapshot through this operation. The runtime
    RECOMPUTES the route on read through the SAME `RouteProvider` that produces
    the quote (the polyline is not persisted and no migration is added), returns
    the authoritative `route_quote` legs/totals plus the Google-compatible
    `encoded_polyline`, and performs NO pricing: the response carries no
    `final_price`, no `amount_cents` and no price member of any kind, so it can
    never be mistaken for the accepted proposal/assignment pricing snapshot.
    `route_quote.provider_to_pickup` stays absent because the runtime owns no
    canonical partner-origin geometry for this read (the frozen provider/truck
    leg remains on the accepted pricing snapshot); a future delivery may add it
    without changing this contract. A provider failure is
    `503 external_dependency_unavailable` with no fabricated geometry. No path,
    parameter, response shape or enum member is removed or narrowed, and the
    base contract stays byte-identical.
servers:
  - url: /api
security: []
tags:
  - name: Tow Module
  - name: Tow Customer
  - name: Tow Partner
  - name: Tow Vehicles
  - name: Tow Admin
paths:
  /tow/module-status:
    $ref: './tow-api-contract.base.openapi.yaml#/paths/~1tow~1module-status'

  /tow/requests:
    get:
      tags: [Tow Customer]
      operationId: listTowRequests
      security: [{ bearerAuth: [] }]
      description: >-
        Lists Tow requests owned by the authenticated customer, newest first.
        Canonical REST recovery/discovery endpoint after process death,
        logout/login, reinstall, device switch or loss of a cached request id.
      parameters:
        - name: state
          in: query
          schema:
            $ref: './tow-api-contract.base.openapi.yaml#/components/schemas/TowRequestState'
        - $ref: './tow-api-contract.base.openapi.yaml#/components/parameters/From'
        - $ref: './tow-api-contract.base.openapi.yaml#/components/parameters/To'
        - $ref: './tow-api-contract.base.openapi.yaml#/components/parameters/Page'
        - $ref: './tow-api-contract.base.openapi.yaml#/components/parameters/Limit'
      responses:
        '200':
          description: Customer Tow request history/current work
          content:
            application/json:
              schema:
                $ref: './tow-api-contract.base.openapi.yaml#/components/schemas/TowRequestListResponse'
        '401': { $ref: './tow-api-contract.base.openapi.yaml#/components/responses/Unauthorized' }
        '403': { $ref: './tow-api-contract.base.openapi.yaml#/components/responses/Forbidden' }
    post:
      tags: [Tow Customer]
      operationId: createTowRequest
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: './tow-api-contract.base.openapi.yaml#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: './tow-api-contract.base.openapi.yaml#/components/schemas/CreateTowRequestInput'
      responses:
        '201':
          description: Tow request created
          content:
            application/json:
              schema:
                $ref: './tow-api-contract.base.openapi.yaml#/components/schemas/TowRequestResponse'
        '401': { $ref: './tow-api-contract.base.openapi.yaml#/components/responses/Unauthorized' }
        '403': { $ref: './tow-api-contract.base.openapi.yaml#/components/responses/Forbidden' }
        '409': { $ref: './tow-api-contract.base.openapi.yaml#/components/responses/DomainConflict' }
        '422': { $ref: './tow-api-contract.base.openapi.yaml#/components/responses/ValidationError' }

  /tow/requests/{requestId}:
    $ref: './tow-api-contract.base.openapi.yaml#/paths/~1tow~1requests~1{requestId}'
  /tow/requests/{requestId}/destination:
    $ref: './tow-api-contract.base.openapi.yaml#/paths/~1tow~1requests~1{requestId}~1destination'
  /tow/requests/{requestId}/proposals:
    get:
      tags: [Tow Customer]
      operationId: listTowRequestProposals
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: './tow-api-contract.base.openapi.yaml#/components/parameters/RequestId'
        - name: status
          in: query
          schema: { $ref: '#/components/schemas/TowProposalStatus' }
        - $ref: './tow-api-contract.base.openapi.yaml#/components/parameters/Page'
        - $ref: './tow-api-contract.base.openapi.yaml#/components/parameters/Limit'
      responses:
        '200':
          description: Proposals for customer request
          content:
            application/json:
              schema: { $ref: './tow-api-contract.base.openapi.yaml#/components/schemas/TowProposalListResponse' }
        '401': { $ref: './tow-api-contract.base.openapi.yaml#/components/responses/Unauthorized' }
        '403': { $ref: './tow-api-contract.base.openapi.yaml#/components/responses/Forbidden' }
        '404': { $ref: './tow-api-contract.base.openapi.yaml#/components/responses/NotFound' }
        '422': { $ref: './tow-api-contract.base.openapi.yaml#/components/responses/ValidationError' }
    post:
      tags: [Tow Partner]
      operationId: createTowProposal
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: './tow-api-contract.base.openapi.yaml#/components/parameters/RequestId'
        - $ref: './tow-api-contract.base.openapi.yaml#/components/parameters/IdempotencyKey'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
      responses:
        '201':
          description: Server-calculated proposal
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TowProposalResponse' }
        '401': { $ref: './tow-api-contract.base.openapi.yaml#/components/responses/Unauthorized' }
        '403': { $ref: './tow-api-contract.base.openapi.yaml#/components/responses/Forbidden' }
        '404': { $ref: './tow-api-contract.base.openapi.yaml#/components/responses/NotFound' }
        '409': { $ref: './tow-api-contract.base.openapi.yaml#/components/responses/DomainConflict' }
        '422': { $ref: './tow-api-contract.base.openapi.yaml#/components/responses/ValidationError' }
  /tow/requests/{requestId}/route:
    get:
      tags: [Tow Customer, Tow Partner]
      operationId: getTowRequestRoute
      security: [{ bearerAuth: [] }]
      description: >-
        Returns the request's own pickup -> destination route snapshot used for
        visualization: the authoritative `route_quote` distance/duration plus the
        Google-compatible `encoded_polyline` the mobile renders. The route is
        recomputed on read through the backend RouteProvider and the endpoint
        performs NO pricing. `route_quote.provider_to_pickup` is absent because
        the runtime owns no canonical partner-origin geometry for this read; the
        frozen provider/truck leg of an accepted proposal stays on the pricing
        snapshot. Readable by the owning customer or the assigned Tow partner.
      parameters:
        - $ref: './tow-api-contract.base.openapi.yaml#/components/parameters/RequestId'
      responses:
        '200':
          description: Authoritative route snapshot
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TowRouteResponse' }
        '401': { $ref: './tow-api-contract.base.openapi.yaml#/components/responses/Unauthorized' }
        '403': { $ref: './tow-api-contract.base.openapi.yaml#/components/responses/Forbidden' }
        '404': { $ref: './tow-api-contract.base.openapi.yaml#/components/responses/NotFound' }

  /tow/proposals/{proposalId}/accept:
    post:
      tags: [Tow Customer]
      operationId: acceptTowProposal
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: './tow-api-contract.base.openapi.yaml#/components/parameters/ProposalId'
        - $ref: './tow-api-contract.base.openapi.yaml#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: Atomic assignment completed
          content:
            application/json:
              schema: { $ref: './tow-api-contract.base.openapi.yaml#/components/schemas/TowRequestResponse' }
        '401': { $ref: './tow-api-contract.base.openapi.yaml#/components/responses/Unauthorized' }
        '403': { $ref: './tow-api-contract.base.openapi.yaml#/components/responses/Forbidden' }
        '404': { $ref: './tow-api-contract.base.openapi.yaml#/components/responses/NotFound' }
        '409': { $ref: './tow-api-contract.base.openapi.yaml#/components/responses/DomainConflict' }
        '422': { $ref: './tow-api-contract.base.openapi.yaml#/components/responses/ValidationError' }
  /tow/proposals/{proposalId}/counteroffer:
    $ref: './tow-api-contract.base.openapi.yaml#/paths/~1tow~1proposals~1{proposalId}~1counteroffer'
  /tow/proposals/{proposalId}/withdraw:
    post:
      tags: [Tow Partner]
      operationId: withdrawTowProposal
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: './tow-api-contract.base.openapi.yaml#/components/parameters/ProposalId'
        - $ref: './tow-api-contract.base.openapi.yaml#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: Proposal withdrawn (a retry by the owning partner returns the same withdrawn proposal)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TowProposalResponse' }
        '401': { $ref: './tow-api-contract.base.openapi.yaml#/components/responses/Unauthorized' }
        '403': { $ref: './tow-api-contract.base.openapi.yaml#/components/responses/Forbidden' }
        '404': { $ref: './tow-api-contract.base.openapi.yaml#/components/responses/NotFound' }
        '409': { $ref: './tow-api-contract.base.openapi.yaml#/components/responses/DomainConflict' }
        '422': { $ref: './tow-api-contract.base.openapi.yaml#/components/responses/ValidationError' }
  /tow/counteroffers/{counterofferId}/accept:
    $ref: './tow-api-contract.base.openapi.yaml#/paths/~1tow~1counteroffers~1{counterofferId}~1accept'
  /tow/counteroffers/{counterofferId}/reject:
    $ref: './tow-api-contract.base.openapi.yaml#/paths/~1tow~1counteroffers~1{counterofferId}~1reject'
  /tow/requests/{requestId}/payment-method:
    $ref: './tow-api-contract.base.openapi.yaml#/paths/~1tow~1requests~1{requestId}~1payment-method'
  /tow/requests/{requestId}/payment:
    $ref: './tow-api-contract.base.openapi.yaml#/paths/~1tow~1requests~1{requestId}~1payment'
  /tow/requests/{requestId}/cancel:
    post:
      tags: [Tow Customer]
      operationId: cancelTowRequestByCustomer
      security: [{ bearerAuth: [] }]
      description: >-
        The OWNING customer cancels a request that has not started transit
        (`ASSIGNED`, `EN_ROUTE`, `ARRIVED`). The body is optional
        (`reason`, max 1000). The terminal attribution
        (`terminal_reason` `CUSTOMER_CANCELLED`, `cancelled_by_actor_type`
        `customer`, `cancelled_by_actor_id` = the customer's user id) and the
        assignment release (`release_reason` `CANCELLED`) happen in the same
        transaction as the state change; MVP-05 records no fee, debt or refund,
        so `financial_consequence` is always zero-valued. Replaying the
        cancellation is a 200 that changes nothing.
      parameters:
        - $ref: './tow-api-contract.base.openapi.yaml#/components/parameters/RequestId'
        - $ref: './tow-api-contract.base.openapi.yaml#/components/parameters/IdempotencyKey'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                reason: { type: [string, 'null'], maxLength: 1000 }
      responses:
        '200':
          description: Cancellation processed
          content:
            application/json:
              schema: { $ref: './tow-api-contract.base.openapi.yaml#/components/schemas/CancellationResponse' }
        '401': { $ref: './tow-api-contract.base.openapi.yaml#/components/responses/Unauthorized' }
        '403': { $ref: './tow-api-contract.base.openapi.yaml#/components/responses/Forbidden' }
        '404': { $ref: './tow-api-contract.base.openapi.yaml#/components/responses/NotFound' }
        '409': { $ref: './tow-api-contract.base.openapi.yaml#/components/responses/DomainConflict' }
        '422': { $ref: './tow-api-contract.base.openapi.yaml#/components/responses/ValidationError' }
  /tow/requests/{requestId}/completion/confirm:
    $ref: './tow-api-contract.base.openapi.yaml#/paths/~1tow~1requests~1{requestId}~1completion~1confirm'
  /tow/requests/{requestId}/disputes:
    $ref: './tow-api-contract.base.openapi.yaml#/paths/~1tow~1requests~1{requestId}~1disputes'
  /tow/requests/{requestId}/review:
    $ref: './tow-api-contract.base.openapi.yaml#/paths/~1tow~1requests~1{requestId}~1review'
  /tow/requests/{requestId}/tracking:
    get:
      tags: [Tow Customer, Tow Partner]
      operationId: getTowTracking
      security: [{ bearerAuth: [] }]
      description: >-
        The CURRENT tracking snapshot of one request: at most one point (the
        latest accepted one, or `null` before the partner's first write) plus the
        canonical route geometry (`pickup`/`destination`) read from the request
        itself. Readable by the owning customer and by the assigned partner only;
        the route is NOT recomputed here, so this operation never calls a routing
        provider and has no tracking history.
      parameters:
        - $ref: './tow-api-contract.base.openapi.yaml#/components/parameters/RequestId'
      responses:
        '200':
          description: Latest tracking snapshot
          content:
            application/json:
              schema: { $ref: './tow-api-contract.base.openapi.yaml#/components/schemas/TrackingResponse' }
        '401': { $ref: './tow-api-contract.base.openapi.yaml#/components/responses/Unauthorized' }
        '403': { $ref: './tow-api-contract.base.openapi.yaml#/components/responses/Forbidden' }
        '404': { $ref: './tow-api-contract.base.openapi.yaml#/components/responses/NotFound' }
    post:
      tags: [Tow Partner]
      operationId: postTowTrackingPoint
      security: [{ bearerAuth: [] }]
      description: >-
        Records the partner's current position for one request. One row per
        request is kept (`observed_at` is the client `recorded_at`, `received_at`
        is the backend instant); a point strictly OLDER than the stored one is
        refused with `stale_tracking_update` and an equal instant is accepted. The
        assigned partner of THAT request is the only writer, and a terminal
        request accepts no further point (`invalid_tow_state`).
      parameters:
        - $ref: './tow-api-contract.base.openapi.yaml#/components/parameters/RequestId'
        - $ref: './tow-api-contract.base.openapi.yaml#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: './tow-api-contract.base.openapi.yaml#/components/schemas/TrackingPoint' }
      responses:
        '202':
          description: Tracking point accepted
          content:
            application/json:
              schema: { $ref: './tow-api-contract.base.openapi.yaml#/components/schemas/TrackingPointResponse' }
        '401': { $ref: './tow-api-contract.base.openapi.yaml#/components/responses/Unauthorized' }
        '403': { $ref: './tow-api-contract.base.openapi.yaml#/components/responses/Forbidden' }
        '404': { $ref: './tow-api-contract.base.openapi.yaml#/components/responses/NotFound' }
        '409': { $ref: './tow-api-contract.base.openapi.yaml#/components/responses/DomainConflict' }
        '422': { $ref: './tow-api-contract.base.openapi.yaml#/components/responses/ValidationError' }

  /tow/requests/{requestId}/en-route:
    post:
      tags: [Tow Partner]
      operationId: startTowEnRoute
      security: [{ bearerAuth: [] }]
      description: >-
        `ASSIGNED` -> `EN_ROUTE`, written with the backend instant
        (`en_route_at`). Replaying it on an already-`EN_ROUTE` request is a 200
        that writes nothing.
      parameters:
        - $ref: './tow-api-contract.base.openapi.yaml#/components/parameters/RequestId'
        - $ref: './tow-api-contract.base.openapi.yaml#/components/parameters/IdempotencyKey'
      responses:
        '200': { $ref: './tow-api-contract.base.openapi.yaml#/components/responses/TowRequestUpdated' }
        '401': { $ref: './tow-api-contract.base.openapi.yaml#/components/responses/Unauthorized' }
        '403': { $ref: './tow-api-contract.base.openapi.yaml#/components/responses/Forbidden' }
        '404': { $ref: './tow-api-contract.base.openapi.yaml#/components/responses/NotFound' }
        '409': { $ref: './tow-api-contract.base.openapi.yaml#/components/responses/DomainConflict' }
        '422': { $ref: './tow-api-contract.base.openapi.yaml#/components/responses/ValidationError' }

  /tow/requests/{requestId}/arrived:
    post:
      tags: [Tow Partner]
      operationId: markTowArrived
      security: [{ bearerAuth: [] }]
      description: >-
        `EN_ROUTE` -> `ARRIVED`, written with the backend instant (`arrived_at`).
        The `LocationInput` body is required and validated, but the arrival
        position is NOT persisted as tracking: the tracking point is the
        partner's own `postTowTrackingPoint` write.
      parameters:
        - $ref: './tow-api-contract.base.openapi.yaml#/components/parameters/RequestId'
        - $ref: './tow-api-contract.base.openapi.yaml#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: './tow-api-contract.base.openapi.yaml#/components/schemas/LocationInput' }
      responses:
        '200': { $ref: './tow-api-contract.base.openapi.yaml#/components/responses/TowRequestUpdated' }
        '401': { $ref: './tow-api-contract.base.openapi.yaml#/components/responses/Unauthorized' }
        '403': { $ref: './tow-api-contract.base.openapi.yaml#/components/responses/Forbidden' }
        '404': { $ref: './tow-api-contract.base.openapi.yaml#/components/responses/NotFound' }
        '409': { $ref: './tow-api-contract.base.openapi.yaml#/components/responses/DomainConflict' }
        '422': { $ref: './tow-api-contract.base.openapi.yaml#/components/responses/ValidationError' }

  /tow/requests/{requestId}/in-transit:
    post:
      tags: [Tow Partner]
      operationId: startTowInTransit
      security: [{ bearerAuth: [] }]
      description: >-
        `ARRIVED` -> `IN_TRANSIT`, written with the backend instant
        (`in_transit_at`). After this transition the request can no longer be
        cancelled: `cancel` answers `invalid_tow_transition`.
      parameters:
        - $ref: './tow-api-contract.base.openapi.yaml#/components/parameters/RequestId'
        - $ref: './tow-api-contract.base.openapi.yaml#/components/parameters/IdempotencyKey'
      responses:
        '200': { $ref: './tow-api-contract.base.openapi.yaml#/components/responses/TowRequestUpdated' }
        '401': { $ref: './tow-api-contract.base.openapi.yaml#/components/responses/Unauthorized' }
        '403': { $ref: './tow-api-contract.base.openapi.yaml#/components/responses/Forbidden' }
        '404': { $ref: './tow-api-contract.base.openapi.yaml#/components/responses/NotFound' }
        '409': { $ref: './tow-api-contract.base.openapi.yaml#/components/responses/DomainConflict' }
        '422': { $ref: './tow-api-contract.base.openapi.yaml#/components/responses/ValidationError' }

  /tow/requests/{requestId}/finish:
    post:
      tags: [Tow Partner]
      operationId: finishTowService
      security: [{ bearerAuth: [] }]
      description: >-
        `IN_TRANSIT` -> `COMPLETED`, written with the backend instant
        (`completed_at`). This is a terminal transition: the assignment is
        released in the same transaction (`release_reason` `COMPLETED`), and the
        partner becomes assignable again. Replaying it on a `COMPLETED` request
        is the only accepted terminal replay (200, no write).
      parameters:
        - $ref: './tow-api-contract.base.openapi.yaml#/components/parameters/RequestId'
        - $ref: './tow-api-contract.base.openapi.yaml#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: './tow-api-contract.base.openapi.yaml#/components/schemas/LocationInput' }
      responses:
        '200': { $ref: './tow-api-contract.base.openapi.yaml#/components/responses/TowRequestUpdated' }
        '401': { $ref: './tow-api-contract.base.openapi.yaml#/components/responses/Unauthorized' }
        '403': { $ref: './tow-api-contract.base.openapi.yaml#/components/responses/Forbidden' }
        '404': { $ref: './tow-api-contract.base.openapi.yaml#/components/responses/NotFound' }
        '409': { $ref: './tow-api-contract.base.openapi.yaml#/components/responses/DomainConflict' }
        '422': { $ref: './tow-api-contract.base.openapi.yaml#/components/responses/ValidationError' }
  /tow/requests/{requestId}/cash-received:
    $ref: './tow-api-contract.base.openapi.yaml#/paths/~1tow~1requests~1{requestId}~1cash-received'
  /tow/requests/{requestId}/cancel-partner:
    post:
      tags: [Tow Partner]
      operationId: cancelTowRequestByPartner
      security: [{ bearerAuth: [] }]
      description: >-
        The ASSIGNED partner cancels a request that has not started transit
        (`ASSIGNED`, `EN_ROUTE`, `ARRIVED`) and MUST give a reason
        (`RequiredReasonInput`, 1-2000 characters). Attribution is
        `terminal_reason` `PARTNER_CANCELLED`, `cancelled_by_actor_type`
        `partner`, `cancelled_by_actor_id` = the partner id; the assignment is
        released with `release_reason` `CANCELLED`. `financial_consequence` is
        always zero-valued in MVP-05. Replaying the cancellation is a 200 that
        changes nothing.
      parameters:
        - $ref: './tow-api-contract.base.openapi.yaml#/components/parameters/RequestId'
        - $ref: './tow-api-contract.base.openapi.yaml#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: './tow-api-contract.base.openapi.yaml#/components/schemas/RequiredReasonInput' }
      responses:
        '200':
          description: Partner cancellation processed
          content:
            application/json:
              schema: { $ref: './tow-api-contract.base.openapi.yaml#/components/schemas/CancellationResponse' }
        '401': { $ref: './tow-api-contract.base.openapi.yaml#/components/responses/Unauthorized' }
        '403': { $ref: './tow-api-contract.base.openapi.yaml#/components/responses/Forbidden' }
        '404': { $ref: './tow-api-contract.base.openapi.yaml#/components/responses/NotFound' }
        '409': { $ref: './tow-api-contract.base.openapi.yaml#/components/responses/DomainConflict' }
        '422': { $ref: './tow-api-contract.base.openapi.yaml#/components/responses/ValidationError' }
  /tow/requests/{requestId}/customer-no-show:
    $ref: './tow-api-contract.base.openapi.yaml#/paths/~1tow~1requests~1{requestId}~1customer-no-show'

  /tow/partner/status:
