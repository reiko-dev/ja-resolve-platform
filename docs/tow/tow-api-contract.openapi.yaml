        '401': { $ref: './tow-api-contract.base.openapi.yaml#/components/responses/Unauthorized' }
        '403': { $ref: './tow-api-contract.base.openapi.yaml#/components/responses/Forbidden' }
        '422': { $ref: './tow-api-contract.base.openapi.yaml#/components/responses/ValidationError' }
  /tow/partner/jobs:
    get:
      tags: [Tow Partner]
      operationId: listPartnerTowJobs
      security: [{ bearerAuth: [] }]
      description: >-
        Lists the Tow jobs of the AUTHENTICATED Tow partner. The identity is taken
        exclusively from the bearer token (`req.user.partner_id`): no query, path
        or body field can select another partner's jobs, and a foreign partner's
        job is never returned. Items are read from `tow_assignments` — the single
        authority on occupancy/jobs, the same one the customer recovery path reads
        — so the partner and the customer can never disagree about the final
        price, the vehicle or the instant of a job. `from` and `to` are INCLUSIVE
        bounds on `assignment.assigned_at` (the assignment instant), not on the
        request creation instant; `state` filters the current Tow request state.
        Newest assignment first, paginated by `page`/`limit`.
      parameters:
        - name: state
          in: query
          schema:
            $ref: './tow-api-contract.base.openapi.yaml#/components/schemas/TowRequestState'
        - $ref: './tow-api-contract.base.openapi.yaml#/components/parameters/From'
        - $ref: './tow-api-contract.base.openapi.yaml#/components/parameters/To'
        - $ref: './tow-api-contract.base.openapi.yaml#/components/parameters/Page'
        - $ref: './tow-api-contract.base.openapi.yaml#/components/parameters/Limit'
      responses:
        '200':
          description: Assigned/in-flight/history Tow jobs for the authenticated partner
          content:
            application/json:
              schema:
                $ref: './tow-api-contract.base.openapi.yaml#/components/schemas/TowRequestListResponse'
        '401': { $ref: './tow-api-contract.base.openapi.yaml#/components/responses/Unauthorized' }
        '403': { $ref: './tow-api-contract.base.openapi.yaml#/components/responses/Forbidden' }
        '422': { $ref: './tow-api-contract.base.openapi.yaml#/components/responses/ValidationError' }
