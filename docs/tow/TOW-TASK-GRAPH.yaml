version: 3
project: JaResolve
domain: tow
strategy: tow_mvp_then_production_hardening

contract:
  baseline_pr: 9
  long_term_contract_preserved: true

implementation_baseline:
  main_sha: 1f589d60b8f8020cc6162ebf2c5200c0d2cfa632   # MVP-02 accepted (PR #36, receipt #5749173315)
  schema_fingerprint: 37cee47edc8dd1084786ab5fe3c32511c71b9a4a2788f67406391916c7cc0f59

execution_policy:
  method: TDD
  cycle: [RED, GREEN, REFACTOR, FOCUSED_INTEGRATION_GATE, ADVERSARIAL_REVIEW, EXTERNAL_REVIEW, MERGE, POST_MERGE_VERIFY, ACCEPTED]
  require_dependency_receipts: true
  require_real_postgres_for_db_and_concurrency: true
  forbid_hidden_skips: true
  phase_1_ready_gate: MVP06
  phase_2_issue: 33

pricing_contract:
  distance_unit: meter
  total_distance: provider_to_pickup_plus_pickup_to_destination
  excess_billing: proportional_by_meter
  ceil_excess_km: false
  monetary_rounding: ROUND_HALF_UP_TO_CENT
  consumer_recalculates_price: false

module_contract:
  module_key: tow
  service_key: tow
  partner_type: tow
  mvp_when_disabled:
    block_new_request: true
    block_new_matching: true
    block_new_proposal: true
    allow_assigned_inflight_to_complete: true
    preserve_partner_vehicle_documents: true
  phase_2_hardening:
    progressive_shutdown: true
    automatic_searching_negotiating_closure: true
    disable_assignment_race_certification: true

foundation:
  T00:
    issue: 11
    status: ACCEPTED
  T01:
    issue: 12
    status: ACCEPTED
    accepted_main_sha: f31962fdd0175303646a34c9d170032bc6a06601

