gates:
  G0: { requires: [T00] }
  G1: { requires: [T01] }
  G2: { requires: [T02, T03, T04] }
  G3: { requires: [T05, T06] }
  G4: { requires: [T07, T08, T09] }
  G5: { requires: [T10, T11] }
  G6: { requires: [T12, T13, T14, T15, T16] }
  G7: { requires: [T17] }
  G8:
    requires: [T18]
    emits: TOW_BACKEND_READY_FOR_INTEGRATION

consumer_handoff:
  mock_implementation_gate:
    requires:
      - PR_9_MERGED
      - OPENAPI_PARSE_PASS
      - EXTERNAL_REF_RESOLUTION_PASS
      - UNIQUE_OPERATION_IDS_PASS
      - MOBILE_CLIENT_SMOKE_PASS
      - MOBILE_PARTNER_SMOKE_PASS
      - DASHBOARD_SMOKE_PASS
      - NO_UNDOCUMENTED_TOW_DTO_OR_ENDPOINT
    emits: TOW_MOBILE_CONTRACT_READY_FOR_IMPLEMENTATION
    allows:
      - generated_clients
      - repositories
      - feature_scaffolding
      - state_management
      - UI_navigation
      - maps_tracking_UI
      - mocks_fakes
      - widget_golden_component_tests
      - mocked_consumer_E2E

  real_backend_integration_gate:
    blocked_until: T18
    requires: [TOW_BACKEND_READY_FOR_INTEGRATION]
    allows:
      - replace_mocks_with_backend
      - real_API_contract_tests
      - real_mobile_backend_E2E
      - integration_signoff

consumers:
  dashboard:
    mock_implementation_allowed_after: TOW_MOBILE_CONTRACT_READY_FOR_IMPLEMENTATION
    real_integration_blocked_until: T18
    required_tests: [UI, API, A11Y, E2E]
    scope:
      - module_toggle
      - settings
      - vehicle_document_verification
      - request_dispute_detail
      - payout_batch
      - audit_admin_override

  mobile_partner:
    mock_implementation_allowed_after: TOW_MOBILE_CONTRACT_READY_FOR_IMPLEMENTATION
    real_integration_blocked_until: T18
    required_tests: [UNIT, UI, UX, API, MAPS, E2E]
    scope:
      - module_status
      - operational_status_location
      - tow_vehicle_documents
      - opportunities_proposals
      - counteroffer
      - jobs_rehydration
      - operational_tracking
      - cash_financial_summary

  mobile_client:
    mock_implementation_allowed_after: TOW_MOBILE_CONTRACT_READY_FOR_IMPLEMENTATION
    real_integration_blocked_until: T18
    required_tests: [UNIT, UI, UX, API, MAPS, E2E]
    scope:
      - module_status
      - request_rehydration
      - create_request
      - proposals_counteroffer
      - payment
      - route_tracking
      - completion_dispute_review
      - debt_repayment