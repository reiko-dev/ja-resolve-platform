version: 2
project: JaResolve
domain: tow
branch: feature/implements-tow-service

source_documents:
  - docs/tow/TOW-PRICING-CONTRACT.md
  - docs/tow/TOW-SERVICE-SPECIFICATION.md
  - docs/tow/TOW-BUSINESS-RULE-MATRIX.md
  - docs/tow/TOW-MODULE-CONTRACT.md
  - docs/tow/TOW-TDD-IMPLEMENTATION-PLAN.md
  - docs/tow/tow-api-contract.openapi.yaml
  - docs/tow/TOW-CONSUMER-FLOW-SPEC.md
  - docs/tow/TOW-CONSUMER-FLOW-COVERAGE.md
  - docs/tow/TOW-CONSUMER-CONTRACT-SMOKE-RESULT.md

execution_policy:
  method: TDD
  cycle: [RED, GREEN, REFACTOR, INTEGRATION_GATE, ACCEPTED]
  require_red_evidence: true
  require_green_evidence: true
  require_dependency_receipts: true
  allow_parallel_when_no_contract_or_file_conflict: true
  forbid_skipped_p0_tests: true
  backend_ready_gate: T18
  minimum_backend_e2e_scenarios: 75

pricing_contract:
  authoritative_distance_unit: meter
  total_distance: provider_to_pickup_plus_pickup_to_destination
  round_excess_to_whole_km: false
  excess_billing: proportional_by_meter
  monetary_rounding: ROUND_HALF_UP_TO_CENT
  immutable_proposal_snapshot: true
  consumer_recalculates_price: false

module_contract:
  module_key: tow
  service_key: tow
  partner_type: tow
  global_feature_flag: enabled
  disable_semantics: graceful_drain
  when_disabled:
    block_new_requests: true
    stop_unassigned_matching: true
    stop_new_proposals: true
    stop_new_counteroffers: true
    stop_new_assignment: true
    close_searching_and_negotiating_with_reason: SERVICE_DISABLED
    allow_assigned_inflight_to_complete: true
    preserve_partner_registration: true
    preserve_tow_vehicles: true
    preserve_documents: true
    allow_admin_management: true

statuses:
  allowed: [PENDING, READY, IN_PROGRESS, REVIEW, ACCEPTED, REJECTED, BLOCKED, RETRY]

tasks:
  - id: T00
    issue: 11
    title: Tow Test Harness & Current-State Audit
    depends_on: []
    outputs:
      - deterministic test harness
      - factories_builders
      - fake_clock
      - maps_fake
      - payment_fake
      - current_to_target_endpoint_audit
      - repeatable_openapi_validation
      - consumer_contract_smoke
    required_tests: [UNIT, DB, API, CONTRACT]
    gate: G0
    status: PENDING

  - id: T01
    issue: 12
    title: Clean Database Baseline, Reset & Admin Seed
    depends_on: [T00]
    outputs:
      - clean_schema_baseline
      - destructive_reset
      - migrations_from_empty
      - admin_only_seed
    required_tests: [MIG, DB, SEC]
    gate: G1
    status: PENDING

  - id: T02
    issue: 13
    title: Tow Module Registry, Global Feature Flag & System Settings Contract
    depends_on: [T01]
    outputs:
      - explicit_tow_module_registration
      - service_partner_linkage
      - global_feature_flag
      - graceful_drain_policy
      - validated_settings
      - admin_module_settings_api
