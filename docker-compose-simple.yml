services:
  # PostgreSQL Database
  postgres:
    image: postgres:14
    container_name: socorre_ai_postgres
    environment:
      POSTGRES_DB: socorre_ai_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5434:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: socorre_ai_redis
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data

  # Backend API (development mode)
  backend:
    image: node:20-alpine
    container_name: socorre_ai_backend
    ports:
      - "3001:3001"
    environment:
      - NODE_ENV=development
      - PORT=3001
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=socorre_ai_db
      - DB_USER=postgres
      - DB_PASSWORD=postgres
      - REDIS_URL=redis://redis:6379
      - JWT_SECRET=dev_jwt_secret_2025_change_in_production
      - SERVICE_PHOTO_STORAGE_DIR=/var/lib/socorre-ai/private/service-photos
      - TOW_DOCUMENT_STORAGE_DIR=/var/lib/socorre-ai/private/tow-documents
    volumes:
      - ./socorre_ai_backend:/app
      - service_photo_data:/var/lib/socorre-ai/private/service-photos
      - tow_document_data:/var/lib/socorre-ai/private/tow-documents
    working_dir: /app
    command: sh -c "npm install && npx knex migrate:latest --knexfile knexfile.js --env development && npm run dev"
    depends_on:
      - postgres
      - redis

  # Backend API with selected legacy routes disabled for smoke validation
  backend_legacy_off:
    profiles: ["legacy-off"]
    image: node:20-alpine
    container_name: socorre_ai_backend_legacy_off
    ports:
      - "3002:3001"
    environment:
      - NODE_ENV=development
      - PORT=3001
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=socorre_ai_db
      - DB_USER=postgres
      - DB_PASSWORD=postgres
      - REDIS_URL=redis://redis:6379
      - JWT_SECRET=dev_jwt_secret_2025_change_in_production
    volumes:
      - ./socorre_ai_backend:/app
    working_dir: /app
    command: sh -c "npm install && npx knex migrate:latest --knexfile knexfile.js --env development && npm run dev"
    depends_on:
      - postgres
      - redis

  # Admin Panel (development mode)
  admin:
    image: node:20-alpine
    container_name: socorre_ai_admin
    ports:
      - "3000:3000"
    environment:
      - REACT_APP_API_URL=http://localhost:3001
      - CHOKIDAR_USEPOLLING=true
    volumes:
      - ./socorre_ai_admin:/app
    working_dir: /app
    command: sh -c "npm install && npm start"
    depends_on:
      - backend

volumes:
  postgres_data:
  redis_data:
  service_photo_data:
  tow_document_data:
