services:
  # PostgreSQL Database
  postgres:
    image: postgres:14
    container_name: socorre_ai_postgres
    environment:
      POSTGRES_DB: socorre_ai_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: socorre_ai_redis
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data

  # Backend API (development mode)
  backend:
    image: node:18-alpine
    container_name: socorre_ai_backend
    ports:
      - "3001:3001"
    environment:
      - NODE_ENV=development
      - PORT=3001
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=socorre_ai_db
      - DB_USER=postgres
      - DB_PASSWORD=postgres
      - REDIS_URL=redis://redis:6379
      - JWT_SECRET=dev_jwt_secret_2025_change_in_production
    volumes:
      - ./socorre_ai_backend:/app
    working_dir: /app
    command: sh -c "npm install && npm run dev"
    depends_on:
      - postgres
      - redis

  # Admin Panel (development mode)
  admin:
    image: node:18-alpine
    container_name: socorre_ai_admin
    ports:
      - "3000:3000"
    environment:
      - REACT_APP_API_URL=http://localhost:3001
      - CHOKIDAR_USEPOLLING=true
    volumes:
      - ./socorre_ai_admin:/app
    working_dir: /app
    command: sh -c "npm install && npm start"
    depends_on:
      - backend

volumes:
  postgres_data:
  redis_data: